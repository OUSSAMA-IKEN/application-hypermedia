<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TP5 | Formulaires</title>
  </head>
  <body>
    <!-- Exercice 2 - Formulaire interactif -->
    <h1>Formulaire d'inscription a une formation</h1>

    <!-- formulaire -->
    <form action="" method="">
      <h4>Choisissez une formation :</h4>

      <input type="radio" name="formation" id="dev" />
      <label for="developpement"> Developpement web</label>

      <br />
      <input type="radio" name="formation" />
      <label for="data_science"> Data Science</label>

      <br />
      <input type="radio" name="formation" />
      <label for="ai">Intelligence Artificielle</label>

      <h4>Vos centres d'interet :</h4>
      <input type="checkbox" name="developpement" />
      <label for="developpement">Developpement Web</label>

      <br />

      <input type="checkbox" name="Data" />
      <label for="Data">Data</label>

      <br />
      <input type="checkbox" name="Design" />
      <label for="Design">Design</label>

      <br />

      <input type="checkbox" name="sport" />
      <label for="">Sport</label>
      <br />

      <label>Niveau d'etudes :</label>
      <select name="" id="">
        <option value="">Licence</option>
        <option value="">Technicien Specialise</option>
        <option value="">Tchnicien</option>
      </select>

      <br />

      <h4>Remarque (faculatif) :</h4>
      <textarea name="remarque" rows="5" cols="32" placeholder="votre remarque">
      </textarea>

      <br />
      <button type="submit">Envoyer</button>
    </form>
  </body>
</html>
